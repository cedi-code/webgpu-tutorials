<!DOCTYPE html>
<html>
    <head>
        <title>Texture Test</title>
        <style>
            html, body {
                margin: 0;
                height: 100%;
            }
            canvas {
                display: block;
                width: 100%;
                height: 100%;
            }
        </style>
        <script type="importmap">
            {
            "imports": {
                "gl-matrix": "https://cdn.skypack.dev/gl-matrix"
            }
            }
    </script>
    </head>
    <body>
        <canvas></canvas>
        <input type="range" id="checkerScale" min="1" max="20" value="2" step="1"> <br>
        <input type="radio" name="adressMode" id="radio-repeat" value="0" checked> <label for="radio-repeat">repeat</label> <br>
        <input type="radio" name="adressMode" id="radio-clamp-to-edge" value="1"> <label for="radio-clamp-to-edge">clamp to edge</label> <br> <br>
        <input type="radio" name="filter" id="radio-linear" value="0" checked> <label for="radio-linear">linear</label> <br>
        <input type="radio" name="filter" id="radio-nearest" value="1"> <label for="radio-nearest">nearest</label> <br>

        <script type="module" src="../texture-test.js"></script>
    </body>
</html>
